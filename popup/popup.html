<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Monitor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>⚡ Performance Monitor</h1>
      <div class="last-update">Loading...</div>
    </header>
    
    <!-- System Overview -->
    <section class="system-overview">
      <div class="stat-card">
        <div class="stat-label">Total Memory Used</div>
        <div class="stat-value" id="totalMemory">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">System Available</div>
        <div class="stat-value" id="systemMemory">--</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Active Tabs</div>
        <div class="stat-value" id="tabCount">--</div>
      </div>
    </section>

    <!-- Add after system-overview section -->
    <section class="chart-section">
      <h3>Memory Usage Over Time</h3>
      <canvas id="memoryChart"></canvas>
    </section>

    
    <!-- Actions -->
    <section class="actions">
      <button id="refreshBtn" class="btn btn-primary">🔄 Refresh</button>
      <button id="suspendAllBtn" class="btn btn-warning">💤 Suspend Inactive</button>
    </section>
    
    <!-- Tab List -->
    <section class="tab-list">
      <div class="section-header">
        <h2>Tabs by Memory Usage</h2>
        <div class="sort-options">
          <label>
            <input type="radio" name="sort" value="memory" checked> Memory
          </label>
          <label>
            <input type="radio" name="sort" value="cpu"> CPU
          </label>
        </div>
      </div>
      <div id="tabListContainer">
        <div class="loading">Loading tab data...</div>
      </div>
    </section>
  </div>
  
  <script src="../utils/formatters.js"></script>
  <script src="popup.js"></script>
  <!-- Add before closing </body> -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

</body>
</html>
